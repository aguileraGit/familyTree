services:
  family_tree:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: family_tree
    restart: unless-stopped
    network_mode: service:ts-family_tree
    ports:
      - "5001:5001"
    environment:
      - FLASK_ENV=production


  ts-family_tree:
    image: tailscale/tailscale:latest
    hostname: family_tree
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_EXTRA_ARGS=--advertise-tags=tag:container
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - tailscale-data-family_tree:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
      - /home/diegoaguilera/Projects/familyTree/tailscale:/config
    cap_add:
      - net_admin
      - sys_module
    restart: unless-stopped

volumes:
  tailscale-data-family_tree:
    driver: local