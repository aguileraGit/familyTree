<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Tree</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        /* Blur overlay */
        #main-content {
            transition: filter 0.3s ease;
        }
        #main-content.blurred {
            filter: blur(6px);
            pointer-events: none;
            user-select: none;
        }

        /* Modal override - always on top */
        #access-modal .modal-dialog { z-index: 1060; }

        /* Tree container */
        #tree-container {
            background: white;
            border-radius: 0 0 8px 8px;
            min-height: 560px;
            overflow: hidden;
            position: relative;
        }

        /* D3 nodes */
        .node circle { fill: #fff; stroke-width: 3px; cursor: pointer; }
        .node circle.male   { stroke: #4a90e2; }
        .node circle.female { stroke: #e94b8f; }
        .node:hover circle  { fill: #f0f0f0; }
        .node text          { font-size: 12px; font-weight: 500; pointer-events: none; }

        /* Badges */
        .badge-male   { background-color: #4a90e2; }
        .badge-female { background-color: #e94b8f; }
        .badge-group  { background-color: #6c757d; margin-right: 2px; }

        /* Tree info bar */
        #tree-info-bar {
            background: linear-gradient(135deg, #0d6efd, #0a58ca);
            color: white;
            padding: 10px 16px;
            border-radius: 8px 8px 0 0;
        }

        #tree-description {
            font-size: 0.85rem;
            opacity: 0.85;
        }

        /* Person details */
        #person-details { display: none; }
        #person-details.show { display: block; }

        /* Sidebar card headers */
        .sidebar-header { font-size: 0.9rem; }
    </style>
</head>
<body>

<!-- ─── Access Code Modal ─────────────────────────────────── -->
<div class="modal fade" id="access-modal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content shadow-lg">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title"><i class="bi bi-diagram-3 me-2"></i>Family Tree</h5>
            </div>
            <div class="modal-body">
                <p class="text-muted mb-3">Enter your family tree access code to continue.</p>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Access Code</label>
                    <input type="text" class="form-control form-control-lg font-monospace"
                           id="modal-access-code" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx">
                </div>
                <div id="modal-error" class="alert alert-danger d-none" role="alert"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary w-100" onclick="enterTree()">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Enter Tree
                </button>
            </div>
        </div>
    </div>
</div>

<!-- ─── Navbar ────────────────────────────────────────────── -->
<nav class="navbar navbar-dark bg-primary">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1"><i class="bi bi-diagram-3 me-2"></i>Family Tree</span>
        <div class="d-flex align-items-center gap-2">
            <span class="text-white-50 small" id="nav-tree-name"></span>
            <button class="btn btn-outline-light btn-sm" onclick="switchTree()">
                <i class="bi bi-box-arrow-right me-1"></i>Log Out
            </button>
        </div>
    </div>
</nav>

<!-- ─── Main Content ──────────────────────────────────────── -->
<div id="main-content" class="container-fluid mt-4">
    <div class="row">

        <!-- Left Sidebar -->
        <div class="col-md-3">

            <!-- Add / Edit Person -->
            <div class="card mb-3">
                <div class="card-header bg-primary text-white sidebar-header">
                    <h6 class="mb-0" id="form-title"><i class="bi bi-person-plus me-1"></i>Add New Person</h6>
                </div>
                <div class="card-body">
                    <form id="person-form">
                        <input type="hidden" id="edit-person-id">

                        <div class="mb-2">
                            <label class="form-label form-label-sm">First Name *</label>
                            <input type="text" class="form-control form-control-sm" id="first_name" required>
                        </div>

                        <div class="mb-2">
                            <label class="form-label form-label-sm">Middle Name</label>
                            <input type="text" class="form-control form-control-sm" id="middle_name">
                        </div>

                        <div class="mb-2">
                            <label class="form-label form-label-sm">Last Name *</label>
                            <input type="text" class="form-control form-control-sm" id="last_name" required>
                        </div>

                        <div class="mb-2">
                            <label class="form-label form-label-sm">Nickname</label>
                            <input type="text" class="form-control form-control-sm" id="nick_name">
                        </div>

                        <div class="mb-2">
                            <label class="form-label form-label-sm">Sex *</label>
                            <select class="form-select form-select-sm" id="sex" required>
                                <option value="">Choose...</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                            </select>
                        </div>

                        <div class="mb-2">
                            <label class="form-label form-label-sm">Father</label>
                            <select class="form-select form-select-sm" id="father_id">
                                <option value="">None</option>
                            </select>
                        </div>

                        <div class="mb-2">
                            <label class="form-label form-label-sm">Mother</label>
                            <select class="form-select form-select-sm" id="mother_id">
                                <option value="">None</option>
                            </select>
                        </div>

                        <div class="mb-2">
                            <label class="form-label form-label-sm">Family Groups</label>
                            <input type="text" class="form-control form-control-sm" id="family_groups"
                                   placeholder="e.g. 1,2,3">
                            <div class="form-text">Comma-separated. Leave blank to auto-assign.</div>
                        </div>

                        <div class="mb-2">
                            <label class="form-label form-label-sm">Birthday</label>
                            <input type="date" class="form-control form-control-sm" id="birthday">
                        </div>

                        <div class="mb-2">
                            <label class="form-label form-label-sm">Place of Birth</label>
                            <input type="text" class="form-control form-control-sm" id="place_of_birth">
                        </div>

                        <div class="mb-3">
                            <label class="form-label form-label-sm">Current Location</label>
                            <input type="text" class="form-control form-control-sm" id="current_location">
                        </div>

                        <button type="submit" class="btn btn-primary btn-sm w-100" id="submit-btn">
                            <i class="bi bi-plus-circle me-1"></i>Add Person
                        </button>
                        <button type="button" class="btn btn-secondary btn-sm w-100 mt-2"
                                id="cancel-btn" style="display:none;" onclick="cancelEdit()">
                            <i class="bi bi-x-circle me-1"></i>Cancel
                        </button>
                    </form>
                </div>
            </div>

            <!-- Actions -->
            <div class="card mb-3">
                <div class="card-header bg-secondary text-white sidebar-header">
                    <h6 class="mb-0"><i class="bi bi-gear me-1"></i>Actions</h6>
                </div>
                <div class="card-body d-grid gap-2">
                    <button class="btn btn-success btn-sm" onclick="loadTree()">
                        <i class="bi bi-arrow-clockwise me-1"></i>Refresh Tree
                    </button>
                    <button class="btn btn-info btn-sm text-white" onclick="exportTree()">
                        <i class="bi bi-download me-1"></i>Export Tree
                    </button>
                    <button class="btn btn-secondary btn-sm" onclick="showStats()">
                        <i class="bi bi-bar-chart me-1"></i>View Stats
                    </button>
                    <button class="btn btn-outline-primary btn-sm" onclick="showGroups()">
                        <i class="bi bi-people me-1"></i>View Groups
                    </button>
                </div>
            </div>

        </div>

        <!-- Main Panel -->
        <div class="col-md-9">

            <!-- Tree info bar + canvas -->
            <div id="tree-info-bar" class="d-flex justify-content-between align-items-center">
                <div>
                    <div class="fw-semibold" id="bar-tree-name">Family Tree</div>
                    <div id="tree-description" class="fst-italic"></div>
                </div>
                <span class="badge bg-light text-dark" id="tree-stats">0 people</span>
            </div>
            <div id="tree-container"></div>

            <!-- Person Details -->
            <div class="card person-card mt-3" id="person-details">
                <div class="card-header bg-info text-white sidebar-header">
                    <h6 class="mb-0"><i class="bi bi-person-lines-fill me-1"></i>Person Details</h6>
                </div>
                <div class="card-body" id="person-details-content"></div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
    const API_BASE = 'http://192.168.1.20:5000/api';
    const STORAGE_KEY = 'family_tree_access_code';

    let accessCode  = null;
    let treeData    = null;
    let svg         = null;
    let g           = null;
    let savedPositions = new Map();
    let accessModal = null;

    // ─── Helpers ─────────────────────────────────────────────

    function displayName(p) {
        // "First [Middle] Last" with optional nickname in quotes
        let name = p.first_name;
        if (p.middle_name) name += ` ${p.middle_name}`;
        name += ` ${p.last_name}`;
        if (p.nick_name) name += ` "${p.nick_name}"`;
        return name;
    }

    function shortName(p) {
        // "First Last" for dropdowns and node labels
        return `${p.first_name} ${p.last_name}`;
    }

    // ─── Boot ────────────────────────────────────────────────

    document.addEventListener('DOMContentLoaded', () => {
        accessModal = new bootstrap.Modal(document.getElementById('access-modal'));
        initializeTree();

        document.getElementById('person-form').addEventListener('submit', savePerson);
        document.getElementById('modal-access-code').addEventListener('keydown', e => {
            if (e.key === 'Enter') enterTree();
        });

        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
            accessCode = stored;
            loadTree();
        } else {
            showModal();
        }
    });

    // ─── Auth / Modal ─────────────────────────────────────────

    function showModal() {
        document.getElementById('main-content').classList.add('blurred');
        document.getElementById('modal-error').classList.add('d-none');
        document.getElementById('modal-access-code').value = '';
        accessModal.show();
    }

    async function enterTree() {
        const code = document.getElementById('modal-access-code').value.trim();
        const errEl = document.getElementById('modal-error');

        if (!code) {
            errEl.textContent = 'Please enter an access code.';
            errEl.classList.remove('d-none');
            return;
        }

        try {
            const res = await fetch(`${API_BASE}/tree/enter`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ access_code: code })
            });
            const data = await res.json();

            if (data.success) {
                accessCode = code;
                localStorage.setItem(STORAGE_KEY, code);
                accessModal.hide();
                document.getElementById('main-content').classList.remove('blurred');
                setTreeMeta(data.tree);
                loadTree();
            } else {
                errEl.textContent = 'Invalid access code. Please try again.';
                errEl.classList.remove('d-none');
            }
        } catch (err) {
            errEl.textContent = 'Could not reach the server. Please try again.';
            errEl.classList.remove('d-none');
        }
    }

    function switchTree() {
        accessCode = null;
        localStorage.removeItem(STORAGE_KEY);
        savedPositions.clear();
        treeData = null;
        if (g) g.selectAll('*').remove();
        document.getElementById('nav-tree-name').textContent = '';
        document.getElementById('bar-tree-name').textContent = 'Family Tree';
        document.getElementById('tree-description').textContent = '';
        document.getElementById('tree-stats').textContent = '0 people';
        document.getElementById('person-details').classList.remove('show');
        showModal();
    }

    function setTreeMeta(tree) {
        document.getElementById('nav-tree-name').textContent = tree.name;
        document.getElementById('bar-tree-name').textContent = tree.name;
        document.getElementById('tree-description').textContent = tree.description || '';
    }

    function apiHeaders() {
        return {
            'Content-Type': 'application/json',
            'X-Access-Code': accessCode
        };
    }

    // ─── Tree init ────────────────────────────────────────────

    function initializeTree() {
        const container = document.getElementById('tree-container');
        const width  = container.clientWidth || 900;
        const height = 560;

        svg = d3.select('#tree-container')
            .append('svg')
            .attr('width', width)
            .attr('height', height);

        g = svg.append('g').attr('transform', 'translate(40,40)');

        svg.call(
            d3.zoom().scaleExtent([0.1, 3]).on('zoom', e => g.attr('transform', e.transform))
        );
    }

    // ─── Load & Visualize ─────────────────────────────────────

    async function loadTree() {
        try {
            const res  = await fetch(`${API_BASE}/export`, { headers: apiHeaders() });
            const data = await res.json();

            if (data.success) {
                treeData = data.tree;
                updateStats(treeData.nodes.length);
                visualizeTree(treeData);
                populateParentDropdowns();
            }
        } catch (err) {
            console.error('Error loading tree:', err);
        }
    }

    function visualizeTree(data) {
        g.selectAll('*').remove();

        if (!data.nodes || data.nodes.length === 0) {
            g.append('text').attr('x', 300).attr('y', 200)
                .attr('text-anchor', 'middle')
                .style('font-size', '16px').style('fill', '#999')
                .text('No people yet. Add someone to get started!');
            return;
        }

        const hierarchy  = buildHierarchy(data);
        const treeLayout = d3.tree().size([820, 480])
            .separation((a, b) => a.parent === b.parent ? 1 : 1.2);
        const root = d3.hierarchy(hierarchy);
        treeLayout(root);

        // Position map — preserve dragged positions
        const posMap = new Map();
        root.descendants().forEach(d => {
            if (savedPositions.has(d.data.id)) {
                const s = savedPositions.get(d.data.id);
                posMap.set(d.data.id, { x: s.x, y: s.y });
            } else {
                posMap.set(d.data.id, { x: d.x, y: d.y });
                savedPositions.set(d.data.id, { x: d.x, y: d.y });
            }
        });

        // Links group
        const linksG = g.append('g').attr('class', 'links');

        function updateLinks() {
            linksG.selectAll('path').remove();
            data.edges.forEach(edge => {
                const s = posMap.get(edge.source);
                const t = posMap.get(edge.target);
                if (s && t) {
                    linksG.append('path')
                        .attr('d', `M${s.x},${s.y} L${t.x},${t.y}`)
                        .style('fill', 'none')
                        .style('stroke', edge.relation === 'father' ? '#4a90e2' : '#e94b8f')
                        .style('stroke-width', 2);
                }
            });
        }
        updateLinks();

        // Drag
        const drag = d3.drag()
            .on('start', function () { d3.select(this).raise().style('cursor', 'grabbing'); })
            .on('drag', function (event, d) {
                posMap.get(d.data.id).x = event.x;
                posMap.get(d.data.id).y = event.y;
                savedPositions.set(d.data.id, { x: event.x, y: event.y });
                d3.select(this).attr('transform', `translate(${event.x},${event.y})`);
                updateLinks();
            })
            .on('end', function () { d3.select(this).style('cursor', 'pointer'); });

        // Nodes
        const node = g.selectAll('.node')
            .data(root.descendants())
            .enter().append('g')
            .attr('class', 'node')
            .attr('transform', d => { const p = posMap.get(d.data.id); return `translate(${p.x},${p.y})`; })
            .style('cursor', 'pointer')
            .call(drag)
            .on('click', (event, d) => { if (!event.defaultPrevented) showPersonDetails(d.data.id); });

        node.append('circle').attr('r', 20)
            .attr('class', d => d.data.sex === 'M' ? 'male' : 'female');

        node.append('text').attr('dy', 35).attr('text-anchor', 'middle')
            .text(d => shortName(d.data));

        node.append('text').attr('dy', 48).attr('text-anchor', 'middle')
            .style('font-size', '10px').style('fill', '#666')
            .text(d => d.data.birthday ? `(${d.data.birthday.split('-')[0]})` : '');
    }

    function buildHierarchy(data) {
        const nodeMap = new Map();
        data.nodes.forEach(n => nodeMap.set(n.id, { ...n, children: [] }));

        const childToParents = new Map();
        data.edges.forEach(e => {
            if (!childToParents.has(e.target)) childToParents.set(e.target, { father: null, mother: null });
            if (e.relation === 'father') childToParents.get(e.target).father = e.source;
            else if (e.relation === 'mother') childToParents.get(e.target).mother = e.source;
        });

        childToParents.forEach((parents, childId) => {
            const child = nodeMap.get(childId);
            const primaryParentId = parents.father || parents.mother;
            if (primaryParentId) {
                const parent = nodeMap.get(primaryParentId);
                if (parent && !parent.children.includes(child)) parent.children.push(child);
            }
        });

        const childIds = new Set(data.edges.map(e => e.target));
        const roots = data.nodes.filter(n => !childIds.has(n.id));

        if (roots.length === 0) return nodeMap.get(data.nodes[0].id);
        if (roots.length === 1) return nodeMap.get(roots[0].id);
        return { id: 'root', name: 'Family Tree', male: true, children: roots.map(r => nodeMap.get(r.id)) };
    }

    // ─── Dropdowns ────────────────────────────────────────────

    function populateParentDropdowns() {
        if (!treeData?.nodes) return;
        const fSel = document.getElementById('father_id');
        const mSel = document.getElementById('mother_id');
        fSel.innerHTML = '<option value="">None</option>';
        mSel.innerHTML = '<option value="">None</option>';

        treeData.nodes.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p.id;
            opt.textContent = shortName(p);
            if (p.sex === 'M') fSel.appendChild(opt.cloneNode(true));
            if (p.sex === 'F') mSel.appendChild(opt.cloneNode(true));
        });
    }

    // ─── Person CRUD ──────────────────────────────────────────

    async function savePerson(event) {
        event.preventDefault();
        const editId = document.getElementById('edit-person-id').value;

        const fgRaw = document.getElementById('family_groups').value.trim();
        const familyGroups = fgRaw
            ? fgRaw.split(',').map(g => parseInt(g.trim())).filter(g => !isNaN(g))
            : undefined;

        const payload = {
            first_name:       document.getElementById('first_name').value,
            last_name:        document.getElementById('last_name').value,
            middle_name:      document.getElementById('middle_name').value || undefined,
            nick_name:        document.getElementById('nick_name').value || undefined,
            sex:              document.getElementById('sex').value,
            father_id:        document.getElementById('father_id').value || undefined,
            mother_id:        document.getElementById('mother_id').value || undefined,
            family_groups:    familyGroups,
            birthday:         document.getElementById('birthday').value || undefined,
            place_of_birth:   document.getElementById('place_of_birth').value || undefined,
            current_location: document.getElementById('current_location').value || undefined,
        };

        try {
            const url    = editId ? `${API_BASE}/person/${editId}` : `${API_BASE}/person`;
            const method = editId ? 'PUT' : 'POST';

            const res    = await fetch(url, { method, headers: apiHeaders(), body: JSON.stringify(payload) });
            const result = await res.json();

            if (result.success) {
                cancelEdit();
                loadTree();
            } else {
                alert('Error: ' + result.error);
            }
        } catch (err) {
            alert('Failed to save person.');
        }
    }

    async function showPersonDetails(personId) {
        if (!personId || personId === 'root') return;

        try {
            const [pRes, parRes] = await Promise.all([
                fetch(`${API_BASE}/person/${personId}`,         { headers: apiHeaders() }),
                fetch(`${API_BASE}/person/${personId}/parents`, { headers: apiHeaders() })
            ]);
            const pData   = await pRes.json();
            const parData = await parRes.json();

            if (!pData.success) return;

            const p       = pData.person;
            const sexBadge = p.sex === 'M' ? 'badge-male' : 'badge-female';
            const sexText  = p.sex === 'M' ? 'Male' : 'Female';
            const groups   = (p.family_groups || []).map(g => `<span class="badge badge-group">Group ${g}</span>`).join(' ');

            let html = `
                <div class="row">
                    <div class="col">
                        <h6 class="mb-1">${displayName(p)}</h6>
                        <p class="mb-1"><span class="badge ${sexBadge}">${sexText}</span> ${groups}</p>
                        <p class="mb-1 text-muted" style="font-size:0.75rem">${personId}</p>
                    </div>
                    <div class="col-auto">
                        <button class="btn btn-primary btn-sm" onclick="editPerson('${personId}')">
                            <i class="bi bi-pencil me-1"></i>Edit
                        </button>
                    </div>
                </div>
                <hr class="my-2">
                <div class="row g-2">`;

            if (p.nick_name)        html += `<div class="col-sm-4"><small class="text-muted">Nickname</small><div>${p.nick_name}</div></div>`;
            if (p.birthday)         html += `<div class="col-sm-4"><small class="text-muted">Birthday</small><div>${p.birthday}</div></div>`;
            if (p.place_of_birth)   html += `<div class="col-sm-4"><small class="text-muted">Place of Birth</small><div>${p.place_of_birth}</div></div>`;
            if (p.current_location) html += `<div class="col-sm-4"><small class="text-muted">Current Location</small><div>${p.current_location}</div></div>`;

            if (parData.success) {
                if (parData.parents.father) html += `<div class="col-sm-4"><small class="text-muted">Father</small><div>${displayName(parData.parents.father)}</div></div>`;
                if (parData.parents.mother) html += `<div class="col-sm-4"><small class="text-muted">Mother</small><div>${displayName(parData.parents.mother)}</div></div>`;
            }

            html += `</div>`;

            document.getElementById('person-details-content').innerHTML = html;
            document.getElementById('person-details').classList.add('show');
        } catch (err) {
            console.error('Error fetching person details:', err);
        }
    }

    async function editPerson(personId) {
        try {
            const [pRes, parRes] = await Promise.all([
                fetch(`${API_BASE}/person/${personId}`,         { headers: apiHeaders() }),
                fetch(`${API_BASE}/person/${personId}/parents`, { headers: apiHeaders() })
            ]);
            const pData   = await pRes.json();
            const parData = await parRes.json();
            if (!pData.success) return;

            const p = pData.person;
            document.getElementById('edit-person-id').value    = personId;
            document.getElementById('first_name').value         = p.first_name || '';
                    document.getElementById('middle_name').value        = p.middle_name || '';
                    document.getElementById('last_name').value          = p.last_name || '';
                    document.getElementById('nick_name').value          = p.nick_name || '';
            document.getElementById('sex').value               = p.sex === 'M' ? 'male' : 'female';
            document.getElementById('birthday').value          = p.birthday || '';
            document.getElementById('place_of_birth').value    = p.place_of_birth || '';
            document.getElementById('current_location').value  = p.current_location || '';
            document.getElementById('family_groups').value     = (p.family_groups || []).join(', ');

            if (parData.success) {
                document.getElementById('father_id').value = parData.parents.father?.id || '';
                document.getElementById('mother_id').value = parData.parents.mother?.id || '';
            }

            document.getElementById('form-title').innerHTML    = '<i class="bi bi-pencil me-1"></i>Edit Person';
            document.getElementById('submit-btn').innerHTML    = '<i class="bi bi-check-circle me-1"></i>Update Person';
            document.getElementById('cancel-btn').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        } catch (err) {
            alert('Failed to load person for editing.');
        }
    }

    function cancelEdit() {
        document.getElementById('edit-person-id').value = '';
        document.getElementById('person-form').reset();
        document.getElementById('form-title').innerHTML    = '<i class="bi bi-person-plus me-1"></i>Add New Person';
        document.getElementById('submit-btn').innerHTML    = '<i class="bi bi-plus-circle me-1"></i>Add Person';
        document.getElementById('cancel-btn').style.display = 'none';
    }

    // ─── Actions ──────────────────────────────────────────────

    function updateStats(count) {
        document.getElementById('tree-stats').textContent = `${count} ${count === 1 ? 'person' : 'people'}`;
    }

    async function exportTree() {
        try {
            const res  = await fetch(`${API_BASE}/export`, { headers: apiHeaders() });
            const data = await res.json();
            if (data.success) {
                const blob = new Blob([JSON.stringify(data.tree, null, 2)], { type: 'application/json' });
                const a    = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: 'family_tree.json' });
                a.click();
            }
        } catch (err) {
            alert('Failed to export tree.');
        }
    }

    async function showStats() {
        try {
            const res  = await fetch(`${API_BASE}/stats`, { headers: apiHeaders() });
            const data = await res.json();
            if (data.success) {
                const s = data.stats;
                alert(`Family Tree Statistics\n\nPeople: ${s.total_people}\nRelationships: ${s.total_relationships}\nFamily Groups: ${s.total_groups}`);
            }
        } catch (err) {
            alert('Failed to fetch stats.');
        }
    }

    async function showGroups() {
        try {
            const res  = await fetch(`${API_BASE}/groups`, { headers: apiHeaders() });
            const data = await res.json();
            if (data.success) {
                let msg = `Family Groups (${data.count} total)\n\n`;
                for (const [id, members] of Object.entries(data.groups)) {
                    msg += `Group ${id}: ${members.length} member(s)\n`;
                                            members.forEach(m => msg += `  - ${shortName(m)} (${m.sex})\n`);
                    msg += '\n';
                }
                alert(msg);
            }
        } catch (err) {
            alert('Failed to fetch groups.');
        }
    }

    function confirmClearTree() {
        if (confirm('⚠️ WARNING\n\nThis will delete ALL people and relationships.\nThis action CANNOT be undone!\n\nAre you sure?')) {
            clearTree();
        }
    }

    async function clearTree() {
        try {
            const res  = await fetch(`${API_BASE}/import`, {
                method: 'POST',
                headers: apiHeaders(),
                body: JSON.stringify({ tree: { nodes: [], edges: [] } })
            });
            const data = await res.json();
            if (data.success) {
                savedPositions.clear();
                loadTree();
            } else {
                alert('Error clearing tree: ' + data.error);
            }
        } catch (err) {
            alert('Failed to clear tree.');
        }
    }
</script>
</body>
</html>
